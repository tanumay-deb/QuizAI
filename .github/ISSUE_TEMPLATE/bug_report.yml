name: 🐛 Bug report
description: Something broken? Tell us what happened.
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I press Ctrl+Shift+Q, the app crashes with...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Change auto-capture interval to 5s
        3. Wait
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 14.5 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: "Run `python --version`"
      placeholder: "3.12.3"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which AI provider were you using?
      options:
        - Google Gemini
        - Anthropic Claude
        - Both
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Relevant log output
      description: Paste any errors from `~/.quizai/quizai.log`. Please redact your API key if it appears.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues and couldn't find a duplicate
          required: true
        - label: I am using the latest released version
          required: true
