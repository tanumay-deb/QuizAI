[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quizai-assistant"
version = "1.0.0"
description = "Desktop AI study assistant: screen-capture quiz/exam questions, get reasoned answers with explanations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Tanumay Goswami" }]
keywords = ["ai", "study", "quiz", "vision", "claude", "gemini", "tutor", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PySide6>=6.6.0",
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "pynput>=1.7.6",
    "pystray>=0.19.5",
    "google-genai>=0.3.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyinstaller>=6.5",
]

[project.urls]
Homepage = "https://github.com/tanumay-deb/quizai-assistant"
Repository = "https://github.com/tanumay-deb/quizai-assistant"
Issues = "https://github.com/tanumay-deb/quizai-assistant/issues"
Changelog = "https://github.com/tanumay-deb/quizai-assistant/blob/main/CHANGELOG.md"

[project.gui-scripts]
quizai = "quizai.app:run"

[tool.setuptools]
packages = ["quizai", "quizai.backends"]

# ----------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line-too-long — handled by formatter
    "B008",  # function-call-in-default-argument — Qt requires this pattern
    "SIM108", # ternary-style preference
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "RUF012"]  # tests may set env vars before imports; mock-class attributes are fine
"quizai/overlay.py" = ["RUF001"]  # ‹ › are intentional UI arrows
"quizai/app.py" = ["RUF001"]       # same in notification text
"quizai/backends/base.py" = ["RUF003"]  # en-dash in docstring comment

# ----------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["quizai"]
omit = [
    "quizai/__main__.py",
    "quizai/tray.py",        # requires real tray
    "quizai/hotkey_manager.py",  # requires display
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
